server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /video_feed {
        proxy_pass http://detection_agent:8002/video_feed;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location /status {
        proxy_pass http://coordinator_agent:8000/status;
    }

    location /alerts {
        proxy_pass http://coordinator_agent:8000/alerts;
    }

    location /query {
        proxy_pass http://coordinator_agent:8000/query;
    }
}
